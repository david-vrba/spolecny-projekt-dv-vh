<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Materiály k výuce informatických seminářů na GJŠ Zlín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --c:#4f46e5; --c-h:rgba(79,70,229,.10); --c-m:rgba(79,70,229,.16); --c-b:rgba(79,70,229,.30);
  --navy:#0f172a; --navy2:#1e293b; --navy3:#334155;
  --ink:#1e293b; --sub:#475569; --mut:#94a3b8;
  --bdr:#e2e8f0; --bg:#f0f4f8; --card:#ffffff;
  --sw:256px; --hh:60px; --bnh:58px; --r:13px;
  --ease:cubic-bezier(.4,0,.2,1);
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9px}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:200;height:var(--hh);background:var(--navy);display:flex;align-items:center;padding:0 1.1rem;gap:.75rem;box-shadow:0 1px 0 rgba(255,255,255,.05),0 6px 24px rgba(0,0,0,.35)}
.logo{display:flex;align-items:center;gap:.55rem;text-decoration:none;flex-shrink:0}
.logo svg{width:22px;height:22px;color:#818cf8;flex-shrink:0}
.logo-t{font-family:'Lora',serif;font-size:.95rem;color:#fff;line-height:1.15;max-width:260px}
.logo-s{display:block;font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:#475569;margin-top:1px}
.srch{margin-left:auto;position:relative;display:flex;align-items:center}
.srch svg{position:absolute;left:.62rem;top:50%;transform:translateY(-50%);width:14px;height:14px;color:#64748b;pointer-events:none}
#si{background:var(--navy2);border:1px solid var(--navy3);border-radius:8px;color:#e2e8f0;font-family:inherit;font-size:.83rem;padding:.4rem 1.9rem .4rem 1.8rem;width:180px;outline:none;transition:border-color .2s,width .3s var(--ease)}
#si::placeholder{color:#475569}
#si:focus{border-color:var(--c);width:240px}
.skbd{position:absolute;right:.4rem;font-size:.58rem;color:#475569;background:var(--navy3);border-radius:4px;padding:.08rem .26rem;pointer-events:none}
#si:focus~.skbd{opacity:0}
.hbtn{display:none;background:none;border:none;cursor:pointer;padding:.35rem;margin-left:auto;color:#94a3b8}
.hbtn svg{width:21px;height:21px}

/* ── LAYOUT ── */
.layout{display:flex;flex:1;min-height:0}

/* ── SIDEBAR ── */
aside{width:var(--sw);flex-shrink:0;background:var(--navy);display:flex;flex-direction:column;padding:.9rem .55rem;gap:2px;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));overflow-y:auto;border-right:1px solid rgba(255,255,255,.04)}
.sb-lbl{font-size:.58rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#334155;padding:.45rem .6rem .15rem}
.nb{display:flex;align-items:center;gap:0;background:none;border:none;border-radius:9px;color:#64748b;font-family:inherit;font-size:.835rem;font-weight:400;padding:0;cursor:pointer;text-align:left;width:100%;transition:background .15s,color .15s;overflow:hidden;position:relative}
.nb:hover{background:rgba(255,255,255,.04);color:#cbd5e1}
.nb-sw{width:4px;min-height:38px;flex-shrink:0;background:transparent;border-radius:2px;transition:background .2s;align-self:stretch}
.nb.on .nb-sw{background:var(--nc,#818cf8)}
.nb-body{display:flex;align-items:center;gap:.5rem;flex:1;padding:.5rem .6rem .5rem .45rem}
.nb.on{background:color-mix(in srgb,var(--nc,#818cf8) 12%,transparent);color:#fff;font-weight:500}
.nb-pill{font-size:.64rem;font-weight:700;letter-spacing:.05em;padding:.15rem .45rem;border-radius:5px;background:color-mix(in srgb,var(--nc,#818cf8) 25%,rgba(255,255,255,.06));color:color-mix(in srgb,var(--nc,#818cf8) 80%,#fff);flex-shrink:0;transition:background .2s,color .2s}
.nb.on .nb-pill{background:var(--nc,#818cf8);color:#fff}
.nb-name{flex:1;line-height:1.25}
.nb-cnt{font-size:.67rem;background:rgba(255,255,255,.07);border-radius:99px;padding:.08rem .38rem;color:#475569;flex-shrink:0;transition:background .2s,color .2s}
.nb.on .nb-cnt{background:rgba(255,255,255,.12);color:#94a3b8}

/* ── MAIN ── */
main{flex:1;padding:1.5rem 1.65rem 2.5rem;min-width:0;overflow-y:auto;height:calc(100vh - var(--hh))}

/* Page header */
.pg-hd{margin-bottom:1.2rem;padding:1.15rem 1.35rem 1rem;border-radius:var(--r);background:linear-gradient(130deg,var(--c-h) 0%,color-mix(in srgb,var(--c-h) 50%,white) 100%);border:1.5px solid var(--c-b);position:relative;overflow:hidden;transition:background .3s,border-color .3s}
.pg-hd::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c);border-radius:var(--r) 0 0 var(--r);transition:background .3s}
.pg-hd::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:color-mix(in srgb,var(--c) 10%,transparent);pointer-events:none}
.pg-eye{display:inline-flex;align-items:center;gap:.35rem;font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:.28rem;transition:color .3s}
.pg-dot{width:5px;height:5px;border-radius:50%;background:var(--c);transition:background .3s}
.pg-title{font-family:'Lora',serif;font-size:1.55rem;color:var(--navy);line-height:1.2}
.pg-desc{font-size:.82rem;color:var(--sub);margin-top:.28rem;line-height:1.6;max-width:510px}

/* Controls */
.ctrls{display:flex;align-items:center;flex-wrap:wrap;gap:.4rem;margin-bottom:.85rem}
.spill{display:inline-flex;align-items:center;gap:.28rem;font-size:.74rem;color:var(--sub);background:var(--card);border:1px solid var(--bdr);border-radius:99px;padding:.2rem .65rem}
.spill strong{color:var(--c);font-weight:600;transition:color .3s}
.btn-ca{margin-left:auto;display:inline-flex;align-items:center;gap:.25rem;font-size:.72rem;font-weight:500;color:var(--sub);background:none;border:1px solid var(--bdr);border-radius:8px;padding:.24rem .6rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-ca:hover{background:var(--card);color:var(--c);border-color:var(--c)}
.btn-ca svg{width:11px;height:11px}

/* Category pills */
.catbar{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.85rem}
.cpill{font-size:.71rem;font-weight:500;background:var(--card);border:1px solid var(--bdr);border-radius:99px;padding:.24rem .7rem;cursor:pointer;transition:all .15s;color:var(--sub);white-space:nowrap}
.cpill:hover{border-color:var(--c);color:var(--c)}
.cpill.on{background:var(--c);border-color:var(--c);color:#fff}

/* Topic cards */
.tlist{display:flex;flex-direction:column;gap:.55rem}
.tc{background:var(--card);border:1.5px solid var(--bdr);border-left:4px solid transparent;border-radius:var(--r);overflow:hidden;transition:box-shadow .18s,border-color .18s,border-left-color .18s;animation:cin .28s ease both}
.tc:hover{box-shadow:0 3px 18px rgba(0,0,0,.09);border-left-color:var(--cc,var(--c))}
.tc.open{border:1.5px solid color-mix(in srgb,var(--cc,var(--c)) 35%,var(--bdr));border-left:4px solid var(--cc,var(--c));box-shadow:0 5px 24px color-mix(in srgb,var(--cc,var(--c)) 14%,transparent)}
@keyframes cin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.tc:nth-child(1){animation-delay:.03s}.tc:nth-child(2){animation-delay:.06s}.tc:nth-child(3){animation-delay:.09s}.tc:nth-child(4){animation-delay:.12s}.tc:nth-child(n+5){animation-delay:.15s}
.thd{display:flex;align-items:center;gap:.65rem;padding:.8rem .9rem;cursor:pointer;user-select:none;transition:background .18s}
.tc.open .thd{background:color-mix(in srgb,var(--cc,var(--c)) 7%,white)}
.tnum{font-family:'Lora',serif;font-size:.9rem;color:#d1d5db;font-weight:700;min-width:1.6rem;flex-shrink:0;line-height:1;transition:color .2s}
.tc.open .tnum{color:var(--cc,var(--c))}
.tinfo{flex:1;min-width:0}
.ttit{font-size:.88rem;font-weight:600;color:var(--navy);line-height:1.35;transition:color .15s}
.tc:hover .ttit,.tc.open .ttit{color:var(--cc,var(--c))}
.tmeta{display:flex;align-items:center;gap:.3rem;flex-wrap:wrap;margin-top:.22rem}
.tdate{font-size:.68rem;color:var(--mut)}
.tstag{font-size:.61rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.11rem .44rem;border-radius:5px}
.tctag{font-size:.61rem;font-weight:500;color:var(--sub);background:var(--bg);border-radius:5px;padding:.11rem .44rem}
.bnew{font-size:.58rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:#fef9c3;color:#ca8a04;border:1px solid #fde68a;border-radius:5px;padding:.1rem .4rem}
.mcbadge{font-size:.68rem;color:var(--sub);background:var(--bg);border:1px solid var(--bdr);border-radius:7px;padding:.1rem .46rem;white-space:nowrap;flex-shrink:0;transition:background .2s,color .2s,border-color .2s}
.tc.open .mcbadge{background:color-mix(in srgb,var(--cc,var(--c)) 14%,white);color:var(--cc,var(--c));border-color:color-mix(in srgb,var(--cc,var(--c)) 28%,var(--bdr))}
.tchev{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex-shrink:0;transition:background .18s}
.tchev svg{width:11px;height:11px;color:var(--sub);transition:transform .25s var(--ease),color .2s}
.tc.open .tchev{background:var(--cc,var(--c))}
.tc.open .tchev svg{transform:rotate(180deg);color:#fff}

/* Accordion body */
.tbody{max-height:0;overflow:hidden;transition:max-height .32s var(--ease)}
.tc.open .tbody{max-height:1400px}
.tbin{border-top:1.5px solid color-mix(in srgb,var(--cc,var(--c)) 20%,var(--bdr));padding:.72rem .9rem .88rem;background:color-mix(in srgb,var(--cc,var(--c)) 4%,#f9fafb);transition:background .3s,border-color .3s}
.tdesc{font-size:.8rem;color:var(--sub);line-height:1.65;margin-bottom:.65rem}

/* Material chips */
.mgrid{display:flex;flex-wrap:wrap;gap:.38rem}
.mchip{display:inline-flex;align-items:center;gap:.45rem;background:var(--card);border:1.5px solid var(--bdr);border-radius:9px;padding:.45rem .68rem;text-decoration:none;color:var(--ink);font-size:.78rem;font-weight:500;transition:border-color .15s,box-shadow .15s,transform .15s,background .15s,color .15s}
.mchip:hover{border-color:var(--cc,var(--c));background:color-mix(in srgb,var(--cc,var(--c)) 7%,white);box-shadow:0 2px 12px color-mix(in srgb,var(--cc,var(--c)) 18%,transparent);transform:translateY(-1px);color:color-mix(in srgb,var(--cc,var(--c)) 80%,var(--ink))}
.mic{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mic svg{width:12px;height:12px}
.tp{background:#fee2e2;color:#dc2626}
.th{background:#dbeafe;color:#2563eb}
.tv{background:#ede9fe;color:#7c3aed}
.ta{background:#fef9c3;color:#ca8a04}
.tl{background:color-mix(in srgb,var(--cc,var(--c)) 14%,#f1f5f9);color:var(--cc,var(--c))}
.mlbl{font-size:.62rem;color:var(--mut);display:block;line-height:1;margin-top:1px;font-weight:400}
.mname{display:block;max-width:165px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Status badge on chip */
.mst{
  display:inline-flex;align-items:center;gap:.22rem;
  font-size:.58rem;font-weight:600;letter-spacing:.04em;
  border-radius:4px;padding:.08rem .32rem;margin-top:2px;
  line-height:1.4;
}
.mst-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
/* draft – šedá */
.mst-d{background:#f1f5f9;color:#64748b}
.mst-d .mst-dot{background:#94a3b8}
/* aic – oranžová */
.mst-a{background:#fff7ed;color:#c2410c}
.mst-a .mst-dot{background:#f97316}
/* fin – zelená */
.mst-f{background:#f0fdf4;color:#15803d}
.mst-f .mst-dot{background:#22c55e}

/* Status filter bar */
.stbar{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.85rem;align-items:center}
.stbar-lbl{font-size:.62rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-right:.1rem;white-space:nowrap}
.spill-st{
  font-size:.71rem;font-weight:500;
  background:var(--card);border:1.5px solid var(--bdr);
  border-radius:99px;padding:.24rem .7rem;
  cursor:pointer;transition:all .15s;color:var(--sub);
  display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap;
}
.spill-st .sd{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.spill-st:hover{border-color:var(--sdc,#94a3b8);color:var(--sdc,#94a3b8)}
.spill-st.on{background:var(--sdc,#94a3b8);border-color:var(--sdc,#94a3b8);color:#fff}
.spill-st.on .sd{background:#fff}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;padding:4rem 1rem;text-align:center;animation:cin .28s ease}
.empty-em{font-size:2rem;margin-bottom:.55rem}
.empty h3{font-size:.93rem;font-weight:600;color:var(--navy)}
.empty p{font-size:.81rem;color:var(--sub);margin-top:.25rem}
mark{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--navy);border-radius:2px;padding:0 2px}

/* Overlay */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;backdrop-filter:blur(3px)}
.ov.show{display:block}

/* Bottom nav */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:190;background:var(--navy);border-top:1px solid rgba(255,255,255,.06);height:var(--bnh);padding-bottom:env(safe-area-inset-bottom,0)}
.bni{display:flex;height:100%;overflow-x:auto;scrollbar-width:none}
.bni::-webkit-scrollbar{display:none}
.bbt{flex:1 0 50px;max-width:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;background:none;border:none;cursor:pointer;padding:.4rem .1rem;color:#475569;font-family:inherit;font-size:.52rem;font-weight:500;transition:color .15s;position:relative}
.bbt.on{color:var(--bc,#818cf8)}
.bbt.on::before{content:'';position:absolute;top:0;left:8%;right:8%;height:2.5px;border-radius:0 0 3px 3px;background:var(--bc,#818cf8)}
.bbt svg{width:18px;height:18px}

/* Mobile search */
.ms{display:none;padding:.48rem .78rem .28rem;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.05);position:sticky;top:var(--hh);z-index:100}
.ms input{width:100%;background:var(--navy2);border:1px solid var(--navy3);border-radius:8px;color:#e2e8f0;font-family:inherit;font-size:.87rem;padding:.46rem .8rem;outline:none}
.ms input::placeholder{color:#475569}
.ms input:focus{border-color:var(--c)}

/* Footer */
footer{background:var(--navy);color:#334155;font-size:.74rem;text-align:center;padding:.85rem}

/* Responsive */
@media(max-width:900px){:root{--sw:228px}main{padding:1.3rem 1.15rem 2rem}}
@media(max-width:700px){
  aside{display:none}
  aside.drawer{display:flex;position:fixed;top:var(--hh);left:-100%;z-index:160;height:calc(100vh - var(--hh));width:230px;transition:left .27s var(--ease)}
  aside.drawer.show{left:0}
  .hbtn{display:flex}.srch{display:none}.ms{display:block}.bnav{display:flex}
  main{padding:.85rem .85rem calc(var(--bnh) + 1.2rem);height:auto;overflow-y:unset}
  .layout{overflow:unset}body{overflow-y:auto}
  .pg-title{font-size:1.28rem}.btn-ca{display:none}.pg-hd{padding:1rem 1.05rem .85rem}
  .logo-t{font-size:.78rem;max-width:160px}
  .logo-s{display:none}
}
@media(max-width:420px){
  .mchip{width:100%}.mname{max-width:none}
  .thd{padding:.72rem .78rem;gap:.55rem}.tbin{padding:.65rem .78rem .82rem}
}
</style>
</head>

<header>
  <a href="#" class="logo" onclick="return false">

  <div class="srch">

  </button>
</header>

<div class="ms"><input id="sm" type="text" placeholder="Hledat v materiálech…" autocomplete="off" spellcheck="false"></div>

    </div>
  </main>
</div>

  audio:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 18v-6a9 9 0 0118 0v6M21 19a2 2 0 01-2 2h-1a2 2 0 01-2-2v-3a2 2 0 012-2h3zM3 19a2 2 0 002 2h1a2 2 0 002-2v-3a2 2 0 00-2-2H3z"/></svg>',
  link: '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>',
  chev:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>'
};
const BNIC={
  all:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  sin:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>',
  cia:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>',
  pvi:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>',
  gdm:'<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>'
};
const TL={pdf:'PDF',html:'Web',video:'Video',audio:'Audio',link:'Odkaz'};
const TCL={pdf:'tp',html:'th',video:'tv',audio:'ta',link:'tl'};

let cur='all',curCat='all',curSt='all',q='',allOpen=false;
const $=id=>document.getElementById(id);
const hl=(t,s)=>s?t.replace(new RegExp(`(${s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'),'<mark>$1</mark>'):t;
const so=id=>subjects.find(s=>s.id===id)||subjects[0];
const ml=n=>n===1?'1 materiál':n<5?`${n} materiály`:`${n} materiálů`;

/* Detect status from URL suffix: -fin. → 'fin', -aic. → 'aic', else → 'draft' */
function urlStatus(url){
  if(!url) return 'draft';
  const u=url.toLowerCase();
  if(/-fin\./.test(u)) return 'fin';
  if(/-aic\./.test(u)) return 'aic';
  return 'draft';
}
/* Status config */
const ST={
  draft:{ cls:'mst-d', dot:'#94a3b8', label:'1. verze',    color:'#94a3b8' },
  aic:  { cls:'mst-a', dot:'#f97316', label:'AI ověřeno',  color:'#f97316' },
  fin:  { cls:'mst-f', dot:'#22c55e', label:'Hotovo',      color:'#22c55e' }
};

function setTheme(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16),root=document.documentElement;
  root.style.setProperty('--c',hex);
  root.style.setProperty('--c-h',`rgba(${r},${g},${b},.10)`);
  root.style.setProperty('--c-m',`rgba(${r},${g},${b},.16)`);
  root.style.setProperty('--c-b',`rgba(${r},${g},${b},.32)`);
}
function ft(){
  const lq=q.toLowerCase();
  return topics.filter(t=>{
    if(cur!=='all'&&t.subjectId!==cur)return false;
    if(curCat!=='all'&&t.category!==curCat)return false;
    if(curSt!=='all'&&!t.materials.some(m=>urlStatus(m.url)===curSt))return false;
    if(!lq)return true;
    return t.title.toLowerCase().includes(lq)||(t.description||'').toLowerCase().includes(lq)||
           (t.category||'').toLowerCase().includes(lq)||t.materials.some(m=>m.title.toLowerCase().includes(lq));
  });
}
function getCats(){return[...new Set(topics.filter(t=>cur==='all'||t.subjectId===cur).map(t=>t.category).filter(Boolean))];}

function rSb(){
  $('sb').innerHTML='<div class="sb-lbl">Předměty</div>'+
    subjects.map(s=>{
      const n=topics.filter(t=>s.id==='all'||t.subjectId===s.id).length,on=s.id===cur;
      return `<button class="nb${on?' on':''}" data-id="${s.id}" style="--nc:${s.color}">
        <span class="nb-sw"></span>
        <span class="nb-body">
          <span class="nb-pill">${s.name}</span>
          <span class="nb-name">${s.fullName}</span>
          <span class="nb-cnt">${n}</span>
        </span>
      </button>`;
    }).join('');
  $('sb').querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.id;curCat='all';curSt='all';allOpen=false;closeSb();render();}));
}
function rBn(){
  $('bnav').innerHTML='<div class="bni">'+
    subjects.map(s=>{
      const on=s.id===cur;
      return `<button class="bbt${on?' on':''}" data-id="${s.id}" style="--bc:${s.color}">
        ${BNIC[s.id]||BNIC.all}<span>${s.name}</span>
      </button>`;
    }).join('')+'</div>';
  $('bnav').querySelectorAll('.bbt').forEach(b=>b.addEventListener('click',()=>{cur=b.dataset.id;curCat='all';curSt='all';allOpen=false;render();window.scrollTo(0,0);}));
}
function rHd(){
  const s=so(cur);setTheme(s.color);
  $('pgHd').innerHTML=`<div class="pg-eye"><span class="pg-dot"></span>${s.name}</div><h1 class="pg-title">${s.fullName}</h1><p class="pg-desc">${s.desc}</p>`;
}
function rCtrls(){
  const f=ft(),mc=f.reduce((a,t)=>a+t.materials.length,0);
  $('ctrls').innerHTML=`<span class="spill"><strong>${f.length}</strong>&nbsp;témat</span><span class="spill"><strong>${mc}</strong>&nbsp;materiálů</span><button class="btn-ca" id="bca">${IC.chev}&nbsp;${allOpen?'Sbalit vše':'Rozbalit vše'}</button>`;
  $('bca')?.addEventListener('click',()=>{allOpen=!allOpen;document.querySelectorAll('.tc').forEach(c=>c.classList.toggle('open',allOpen));$('bca').innerHTML=`${IC.chev}&nbsp;${allOpen?'Sbalit vše':'Rozbalit vše'}`;});
}
function rCat(){
  const cats=getCats();
  if(cats.length<=1){$('catbar').innerHTML='';return;}
  $('catbar').innerHTML=['all',...cats].map(c=>`<button class="cpill${c===curCat?' on':''}" data-cat="${c}">${c==='all'?'Vše':c}</button>`).join('');
  $('catbar').querySelectorAll('.cpill').forEach(b=>b.addEventListener('click',()=>{curCat=b.dataset.cat;curSt='all';allOpen=false;render();}));
}
function rStbar(){
  /* Collect which statuses actually exist among filtered topics (before status filter) */
  const lq=q.toLowerCase();
  const base=topics.filter(t=>{
    if(cur!=='all'&&t.subjectId!==cur)return false;
    if(curCat!=='all'&&t.category!==curCat)return false;
    if(!lq)return true;
    return t.title.toLowerCase().includes(lq)||(t.description||'').toLowerCase().includes(lq)||
           (t.category||'').toLowerCase().includes(lq)||t.materials.some(m=>m.title.toLowerCase().includes(lq));
  });
  const present=new Set(base.flatMap(t=>t.materials.map(m=>urlStatus(m.url))));
  if(present.size<=1){$('stbar').innerHTML='';return;}
  const order=['draft','aic','fin'];
  const available=order.filter(s=>present.has(s));
  $('stbar').innerHTML=
    '<span class="stbar-lbl">Stav:</span>'+
    ['all',...available].map(s=>{
      if(s==='all') return`<button class="spill-st${curSt==='all'?' on':''}" data-st="all" style="--sdc:#6366f1"><span class="sd" style="background:${curSt==='all'?'#fff':'#6366f1'}"></span>Vše</button>`;
      const sc=ST[s];
      return`<button class="spill-st${curSt===s?' on':''}" data-st="${s}" style="--sdc:${sc.color}"><span class="sd" style="background:${curSt===s?'#fff':sc.dot}"></span>${sc.label}</button>`;
    }).join('');
  $('stbar').querySelectorAll('.spill-st').forEach(b=>b.addEventListener('click',()=>{curSt=b.dataset.st;allOpen=false;render();}));
}
function rTopics(){
  const list=$('tlist'),empty=$('empty'),f=ft();
  if(!f.length){list.innerHTML='';empty.style.display='flex';return;}
  empty.style.display='none';
  const cnts={};
  list.innerHTML=f.map(t=>{
    const ts=so(t.subjectId),cc=cur==='all'?ts.color:so(cur).color;
    cnts[t.subjectId]=(cnts[t.subjectId]||0)+1;
    const num=String(cnts[t.subjectId]).padStart(2,'0'),open=!!q;
    const stag=cur==='all'?`<span class="tstag" style="background:${ts.color}22;color:${ts.color}">${ts.name}</span>`:'';
    const ctag=t.category?`<span class="tctag">${hl(t.category,q)}</span>`:'';
    const nb=t.isNew?'<span class="bnew">Nové</span>':'';
    const chips=t.materials.map(m=>{
      const tp=m.type||'link';
      const st=urlStatus(m.url);
      const sc=ST[st];
      return`<a href="${m.url}" target="_blank" rel="noopener" class="mchip">
        <span class="mic ${TCL[tp]||'tl'}">${IC[tp]||IC.link}</span>
        <span>
          <span class="mname">${hl(m.title,q)}</span>
          <span class="mlbl">${TL[tp]||'Odkaz'}</span>
          <span class="mst ${sc.cls}"><span class="mst-dot"></span>${sc.label}</span>
        </span>
      </a>`;
    }).join('');
    return`<div class="tc${open?' open':''}" style="--cc:${cc}"><div class="thd"><span class="tnum">${num}</span><div class="tinfo"><div class="ttit">${hl(t.title,q)}</div><div class="tmeta"><span class="tdate">${t.date}</span>${stag}${ctag}${nb}</div></div><span class="mcbadge">${ml(t.materials.length)}</span><span class="tchev">${IC.chev}</span></div><div class="tbody"><div class="tbin">${t.description?`<p class="tdesc">${hl(t.description,q)}</p>`:''}<div class="mgrid">${chips}</div></div></div></div>`;
  }).join('');
  list.querySelectorAll('.thd').forEach(h=>h.addEventListener('click',()=>h.closest('.tc').classList.toggle('open')));
}
function render(){rSb();rBn();rHd();rCtrls();rCat();rStbar();rTopics();}
function setQ(v){q=v.trim();['si','sm'].forEach(id=>{const e=$(id);if(e&&e.value!==v)e.value=v;});allOpen=false;render();}
$('si')?.addEventListener('input',e=>setQ(e.target.value));
$('sm')?.addEventListener('input',e=>setQ(e.target.value));
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();(window.innerWidth<=700?$('sm'):$('si'))?.focus();}
  if(e.key==='Escape'){setQ('');document.activeElement?.blur();}
});
function closeSb(){$('sb').classList.remove('show');$('ov').classList.remove('show');}
$('hbtn')?.addEventListener('click',()=>{$('sb').classList.toggle('show');$('ov').classList.toggle('show');});
$('ov').addEventListener('click',closeSb);
render();
})();
</script>
</body>
</html>
